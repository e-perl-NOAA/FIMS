name: run-devtools-test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths: &core_paths
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'inst/**'
      - 'data/**'
      - 'data-raw/**'
      - 'vignettes/**'
  push:
    branches:
      - main
    paths: *core_paths

permissions: {}

# Cancel runs happening simultaneously on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devtools-test:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      TESTTHAT_PROGRESS: "plain"
      R_BACKTRACE_ON_ERROR: "full"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::snowfall
          needs: check

      - name: Run devtools::test()
        shell: Rscript {0}
        run: |
          # Use devtools' debug flags so the tests match local development.
          devtools::test()

  julia-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - uses: julia-actions/cache@v2

      - name: Run Julia backend tests
        id: julia-tests
        shell: bash
        run: |
          set +e
          julia --project=inst/julia/FIMSBackend -e 'using Pkg; Pkg.test()' 2>&1 | tee julia-backend-test.log
          test_status=${PIPESTATUS[0]}
          echo "status=${test_status}" >> "${GITHUB_OUTPUT}"
          exit "${test_status}"

      - name: Report Julia test result
        if: always()
        env:
          TEST_STATUS: ${{ steps.julia-tests.outputs.status }}
        run: |
          if [ "${TEST_STATUS}" = "0" ]; then
            echo "## Julia backend tests: passed" >> "${GITHUB_STEP_SUMMARY}"
          elif [ -n "${TEST_STATUS}" ]; then
            echo "## Julia backend tests: failed (exit code ${TEST_STATUS})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Julia backend tests: did not complete" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Julia test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: julia-backend-test-log
          path: julia-backend-test.log
          if-no-files-found: warn
          retention-days: 7
