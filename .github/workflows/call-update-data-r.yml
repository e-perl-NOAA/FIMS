name: call-update-data-r

on:
  push:
    paths: ['R/**', 'inst/**', 'data/**', 'data-raw/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'NOAA-FIMS/FIMS'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: Refresh genuine Julia example fits
        shell: Rscript {0}
        run: |
          Sys.setenv(JULIA_HOME = dirname(Sys.which("julia")))
          source("data-raw/refresh_julia_fits.R")
      - name: Save updated package data
        shell: bash
        run: |
          git add data/fit_big_optimized.rda data/estimates_big_optimized.rda R/sysdata.rda
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Julia example fits"
            git push
          fi
