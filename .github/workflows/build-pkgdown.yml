# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths: &core_paths
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
      - 'inst/**'
      - 'README.md'
      - 'pkgdown/**'
      - '.github/workflows/build-pkgdown.yml'
  push:
    branches:
      - main
    paths: *core_paths
  workflow_dispatch:
  # below is a trigger for when there are changes to the fims website, it pulls
  # the bootstrap file name from there which occasionally changes
  # file in that repo, which change whenever a significant change is made to
  # the website for some reason
  repository_dispatch:
    types: [file-updated]

name: build-pkgdown

permissions:
  contents: write

# Cancel runs happening simultaneously on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - uses: julia-actions/cache@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., any::fs, any::jsonlite, any::yaml, any::purrr, any::stringr
          needs: website

      - name: build pkgdown
        env:
          R_KEEP_PKG_SOURCE: "yes"
          TESTTHAT_PROGRESS: "plain"
          R_BACKTRACE_ON_ERROR: "full"
        run: |
          Sys.setenv(JULIA_HOME = dirname(Sys.which("julia")))
          FIMS::setup_julia()
          pkgdown::build_site(override = list(destination = "docs"))
        shell: Rscript {0}

      - name: Build vignette JSON
        run: Rscript .github/build_vignette_index.R

      - name: save pkgdown output
        uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site-with-reports
          path: docs/
  
      - name: Deploy package
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # This is the folder we built in the "build pkgdown" step
          publish_dir: ./docs
