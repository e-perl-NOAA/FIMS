# Runs covr::codecov() to calculate code coverage.
name: call-calc_coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - 'R/**'
      - 'inst/**'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - 'R/**'
      - 'inst/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::pkgload
          needs: check
      - name: Prepare Julia and calculate R interface coverage
        shell: Rscript {0}
        run: |
          Sys.setenv(JULIA_HOME = dirname(Sys.which("julia")))
          pkgload::load_all(quiet = TRUE, helpers = FALSE)
          setup_julia()
          covr::codecov()
