name: call-r-cmd-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FIMS_RUN_JULIA_INTEGRATION: "true"
      RUN_SLOW_TESTS: "false"
      FIMS_RUN_SLOW_VIGNETTES: "false"
      JULIA_NUM_THREADS: "1"
      NOT_CRAN: "true"
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: Prepare Julia without modifying the package directory
        shell: Rscript {0}
        run: |
          Sys.setenv(JULIA_HOME = dirname(Sys.which("julia")))
          cat("JULIA_HOME=", Sys.getenv("JULIA_HOME"), "\n",
              file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
          pkgload::load_all(quiet = TRUE, helpers = FALSE)
          setup_julia()
      - name: Forbid native FIMS compilation
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          stopifnot(!dir.exists("src"), !dir.exists("inst/include"),
                    !"LinkingTo" %in% colnames(description),
                    description[1, "NeedsCompilation"] == "no")
          makevars <- file.path(Sys.getenv("RUNNER_TEMP"), "Makevars-no-native")
          writeLines(c("CC = fims-compiler-disabled", "CXX = fims-compiler-disabled",
                       "CXX11 = fims-compiler-disabled", "CXX14 = fims-compiler-disabled",
                       "CXX17 = fims-compiler-disabled", "CXX20 = fims-compiler-disabled",
                       "FC = fims-compiler-disabled"), makevars)
          cat("R_MAKEVARS_USER=", makevars, "\nMAKE=fims-make-disabled\n",
              file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
      - name: Build and check with native compilers disabled
        shell: Rscript {0}
        run: |
          # Build frontends may require a compiler even for pure R packages.
          root <- getwd()
          description <- read.dcf("DESCRIPTION")
          windows <- .Platform[["OS.type"]] == "windows"
          executable <- file.path(R.home("bin"), if (windows) "Rcmd.exe" else "R")
          prefix <- if (windows) character() else "CMD"
          run_r_command <- function(arguments) {
            status <- system2(executable, c(prefix, arguments))
            if (status != 0L) stop("R CMD failed with status ", status, call. = FALSE)
          }
          build_directory <- file.path(Sys.getenv("RUNNER_TEMP"), "fims-source-build")
          dir.create(build_directory)
          setwd(build_directory)
          run_r_command(c("build", "--no-manual", shQuote(root)))
          archive <- file.path(build_directory,
            paste0(description[1, "Package"], "_", description[1, "Version"], ".tar.gz"))
          check_directory <- file.path(root, "check")
          dir.create(check_directory)
          setwd(check_directory)
          run_r_command(c("check", "--no-manual", "--as-cran", shQuote(archive)))
          log <- readLines(file.path("FIMS.Rcheck", "00check.log"))
          if (any(grepl("\\b(ERROR|WARNING)\\b", log))) {
            stop("R CMD check reported errors or warnings.", call. = FALSE)
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: R-CMD-check-${{ matrix.os }}
          path: check
