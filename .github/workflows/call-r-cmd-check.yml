name: call-r-cmd-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FIMS_RUN_JULIA_INTEGRATION: "true"
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgload
          needs: check
      - name: Prepare Julia without modifying the package directory
        shell: Rscript {0}
        run: |
          Sys.setenv(JULIA_HOME = dirname(Sys.which("julia")))
          cat("JULIA_HOME=", Sys.getenv("JULIA_HOME"), "\n",
              file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
          pkgload::load_all(quiet = TRUE, helpers = FALSE)
          setup_julia()
      - name: Forbid native FIMS compilation
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          stopifnot(!dir.exists("src"), !dir.exists("inst/include"),
                    !"LinkingTo" %in% colnames(description),
                    description[1, "NeedsCompilation"] == "no")
          makevars <- file.path(Sys.getenv("RUNNER_TEMP"), "Makevars-no-native")
          writeLines(c("CC = fims-compiler-disabled", "CXX = fims-compiler-disabled",
                       "CXX11 = fims-compiler-disabled", "CXX14 = fims-compiler-disabled",
                       "CXX17 = fims-compiler-disabled", "FC = fims-compiler-disabled"), makevars)
          cat("R_MAKEVARS_USER=", makevars, "\nMAKE=fims-make-disabled\n",
              file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
