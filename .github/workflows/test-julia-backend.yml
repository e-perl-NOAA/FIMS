name: Test Julia backend

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: julia-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Run numerical regressions and analytic uncertainty oracles
        run: julia --project=inst/julia/FIMSBackend -e 'using Pkg; Pkg.test()'
