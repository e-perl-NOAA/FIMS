name: Test Julia backend

on:
  workflow_dispatch:
  pull_request:
    # paths:
    #   - ".github/workflows/test-julia-backend.yml"
    #   - "inst/julia/FIMSBackend/**"
    #   - "R/**"
    #   - "tests/testthat/test-julia-backend.R"
    #   - "src/**"
    #   - "inst/include/**"
    #   - "DESCRIPTION"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-julia-backend.yml"
      - "inst/julia/FIMSBackend/**"
      - "R/**"
      - "tests/testthat/test-julia-backend.R"
      - "src/**"
      - "inst/include/**"
      - "DESCRIPTION"

permissions: {}

concurrency:
  group: julia-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Run Julia backend tests
        id: julia-tests
        shell: bash
        run: |
          set +e
          julia --project=inst/julia/FIMSBackend -e 'using Pkg; Pkg.test()' 2>&1 | tee julia-backend-test.log
          test_status=${PIPESTATUS[0]}
          echo "status=${test_status}" >> "${GITHUB_OUTPUT}"
          exit "${test_status}"
      - name: Report Julia test result
        if: always()
        env:
          TEST_STATUS: ${{ steps.julia-tests.outputs.status }}
        run: |
          if [ "${TEST_STATUS}" = "0" ]; then
            echo "## Julia backend tests: passed" >> "${GITHUB_STEP_SUMMARY}"
          elif [ -n "${TEST_STATUS}" ]; then
            echo "## Julia backend tests: failed (exit code ${TEST_STATUS})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Julia backend tests: did not complete" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload Julia test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: julia-backend-test-log
          path: julia-backend-test.log
          if-no-files-found: warn
          retention-days: 7

  backend-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FIMS_RUN_BACKEND_PARITY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Includes the upstream Ubuntu 24.04 libunwind startup fix.
          extra-packages: |
            any::devtools
            github::JuliaInterop/JuliaCall@f7878f0371c6114493c3d067b8fb24cf6160c1cb
          needs: check
      - name: Prepare Julia bridge dependencies before embedding Julia
        shell: bash
        run: |
          export R_HOME="$(R RHOME)"
          julia --startup-file=no -e '
            using Pkg
            Pkg.add(["Suppressor", "RCall"])
            Pkg.build("RCall")
            Pkg.precompile()
            using Suppressor, RCall
            @assert rcopy(R"1 + 1") == 2
          '
      - name: Verify the R-to-Julia bridge
        shell: Rscript {0}
        run: |
          julia_executable <- Sys.which("julia")
          stopifnot(nzchar(julia_executable))
          Sys.setenv(JULIA_HOME = dirname(julia_executable))
          JuliaCall::julia_setup(installJulia = FALSE, install = FALSE)
          stopifnot(JuliaCall::julia_eval("1 + 1") == 2)
          message("R: ", R.version.string)
          message("JuliaCall: ", utils::packageVersion("JuliaCall"))
          message("Julia: ", JuliaCall::julia_eval("string(VERSION)"))
      - name: Compare real native and Julia backends through R
        shell: Rscript {0}
        run: |
          Sys.setenv(JULIA_HOME = dirname(Sys.which("julia")))
          JuliaCall::julia_setup(installJulia = FALSE, install = FALSE)
          devtools::test(
            filter = "^julia-backend$",
            reporter = testthat::MultiReporter$new(list(
              testthat::SummaryReporter$new(),
              testthat::JunitReporter$new(
                file = file.path(getwd(), "backend-parity.xml")
              )
            )),
            stop_on_failure = TRUE
          )
      - name: Upload backend comparison results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-parity-results
          path: backend-parity.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Report backend comparison result
        if: always()
        env:
          PARITY_JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Native/Julia comparison: ${PARITY_JOB_STATUS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Joint objectives and population/fleet reports are compared at identical fixed parameters for both growth models." >> "${GITHUB_STEP_SUMMARY}"
          echo "Limited optimized-fit cases compare catchability estimates and standard errors with and without a recruitment random effect under each growth model." >> "${GITHUB_STEP_SUMMARY}"
