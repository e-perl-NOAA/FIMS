url: https://NOAA-FIMS.github.io/FIMS

home:
  title: Fisheries Integrated Modeling System (FIMS)
  links:
  - text: Julia backend
    href: https://github.com/NOAA-FIMS/FIMS/tree/main/inst/julia/FIMSBackend

authors:
  FIMS implementation team:
    href: https://github.com/orgs/NOAA-FIMS/teams/fims
    html: <img src='https://github.com/NOAA-FIMS/noaa-fims.github.io/blob/main/images/FIMS_hexlogo.png' alt='FIMS' width='72' />

template:
  bootstrap: 5
  includes:
    before_title: <img class="navlogo" src="https://noaa-fims.github.io/images/FIMS_logo3.png" alt="FIMS logo with a fish" width="60" align="left" />
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

reference:
- title: Data
  desc: >
      Example datasets used in demonstrations and other package data.
  contents:
  - ends_with("_big")
  - ends_with("_big_optimized")
  - fims_input_types
  - fims_distributions

- title: Run FIMS
  desc: Primary functions used when setting up or running a FIMS model.
  contents:
  - starts_with("FIMSFrame")
  - "plot,FIMSFrame,missing-method"
  - starts_with("get_FIMSFrame")
  - starts_with("model_")
  - starts_with("setup_default_")
  - has_keyword("distribution")
  - starts_with("initialize_")
  - has_keyword("fit_fims")
  - is_fims_verbose

- title: Diagnostics
  desc: Primary functions used when diagnosing a FIMS model.
  contents:
  - has_keyword("diagnostics")

- title: Package development
  desc: Primary functions used when developing FIMS package.
  contents:
  - has_keyword("developer")
  - use_testthat_template
  - setup_julia
  - summary.FIMSSdreport
  - clear
  - logit
  - inv_logit

- title: Model Tidying and Fit Evaluation
  desc: Functions used to extract, tidy, and evaluate model fit results.
  contents:
  - augment.FIMSFit
  - get_fit_metrics
  - get_fit_stream
  - glance.FIMSFit
  - tidy.FIMSFit

